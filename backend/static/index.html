<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>shushu-hub · 術數整合</title>
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/ichingshifa.css" />
  <link rel="stylesheet" href="/css/qimen.css" />
  <link rel="stylesheet" href="/css/liuren.css" />
  <link rel="stylesheet" href="/css/taiyi.css" />
</head>
<body>
  <!-- Top bar (shared input header) -->
  <div class="topbar">
    <div class="brand">🔮 shushu-hub</div>
    <div class="input-group">
      <span class="text-dim text-tiny">日期</span>
      <input type="date" id="topbar-date" />
    </div>
    <div class="input-group">
      <span class="text-dim text-tiny">時間</span>
      <input type="time" id="topbar-time" value="14:30" />
    </div>
    <div class="input-group">
      <span class="text-dim text-tiny">時區</span>
      <select id="topbar-timezone">
        <option value="Asia/Hong_Kong" selected>Asia/Hong_Kong</option>
        <option value="Asia/Taipei">Asia/Taipei</option>
        <option value="Asia/Shanghai">Asia/Shanghai</option>
        <option value="Asia/Tokyo">Asia/Tokyo</option>
        <option value="America/New_York">America/New_York</option>
        <option value="Europe/London">Europe/London</option>
        <option value="UTC">UTC</option>
      </select>
    </div>
    <div class="input-group" style="flex:1; min-width:200px;">
      <span class="text-dim text-tiny">問事</span>
      <input type="text" id="topbar-question" placeholder="例：事業轉職時機" style="width:100%;" />
    </div>
    <label class="text-tiny text-secondary" style="display:flex;align-items:center;gap:6px;margin-left:auto;">
      <input type="checkbox" id="topbar-true-solar" /> 真太陽時
    </label>
    <button class="btn btn-primary" id="topbar-submit">🔮 起卦</button>
  </div>

  <!-- App shell -->
  <div class="app-shell">
    <!-- Sidebar with tab nav -->
    <aside class="sidebar">
      <h3>📑 排盤系統</h3>
      <div class="tab-nav" id="tab-nav">
        <button data-tab="overview" class="active">🔮 跨系統並排</button>
        <button data-tab="ichingshifa">☯️ 周易 (ichingshifa)</button>
        <button data-tab="liuren">📐 大六壬 (liuren)</button>
        <button data-tab="qimen">⭐ 奇門遁甲 (qimen)</button>
        <button data-tab="taiyi">🔥 太乙神數 (taiyi)</button>
      </div>

      <h3 id="sidebar-section-title">系統選項</h3>
      <div id="sidebar-content">
        <p class="text-tiny text-dim">選擇上方任一系統，這裡會顯示該系統的專屬選項</p>
      </div>

      <hr style="margin-top:24px;" />
      <h3>🔧 設定</h3>
      <button class="btn btn-ghost btn-block" data-action="open-settings" style="margin-top:6px;">
        AI / 顯示設定
      </button>
      <button class="btn btn-ghost btn-block" data-action="reset-state" style="margin-top:6px;">
        重置狀態
      </button>
    </aside>

    <!-- Main content area -->
    <main class="app-main">
      <!-- Tab content sections -->
      <section id="tab-overview" class="tab-content active"></section>
      <section id="tab-ichingshifa" class="tab-content"></section>
      <section id="tab-liuren" class="tab-content"></section>
      <section id="tab-qimen" class="tab-content"></section>
      <section id="tab-taiyi" class="tab-content"></section>
    </main>
  </div>

  <!-- Settings modal (lazy-injected) -->
  <div id="settings-modal" class="modal-backdrop" style="display:none;">
    <div class="modal">
      <h2>🔧 AI 與顯示設定</h2>
      <hr/>
      <div id="settings-content"></div>
      <div class="action-bar" style="margin-top:16px;">
        <button class="btn" data-action="close-settings">關閉</button>
      </div>
    </div>
  </div>

  <style>
    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 14px;
      padding: 24px;
      width: min(560px, 92vw);
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
    .modal label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      margin: 10px 0 4px;
    }
    .modal input, .modal select, .modal textarea {
      width: 100%;
      background: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
    }
    .modal textarea { resize: vertical; min-height: 80px; }
  </style>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
